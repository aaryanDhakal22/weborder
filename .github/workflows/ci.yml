# Unit tests, type check and the production build on every push; the image goes to GHCR from the
# staging branch (staging-latest) and v* tags. The end-to-end suite needs a main (task gate runs it).
name: ci
on:
  push:
    branches: [staging, master]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.18', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  image:
    needs: test
    if: github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quicc-storefront:${{ github.ref == 'refs/heads/staging' && 'staging-latest' || github.ref_name }}
